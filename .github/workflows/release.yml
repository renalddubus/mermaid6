name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

# Sérialiser les publications, y compris la mise à jour de latest.
concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.info.outputs.image }}
      version: ${{ steps.info.outputs.version }}
      prerelease: ${{ steps.info.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - name: Valider le tag et les versions
        id: info
        run: node scripts/release-info.js
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Refuser de remplacer une release publiée
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # Une erreur réseau/authentification ne doit pas être confondue avec une absence.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == false) | .tag_name' > published-tags.txt
          if grep -Fxq "$RELEASE_TAG" published-tags.txt; then
            echo 'Cette release est déjà publiée. Créer une nouvelle version.' >&2
            exit 1
          fi

  check:
    needs: metadata
    uses: ./.github/workflows/ci.yml

  build:
    needs: [metadata, check]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Construire et publier une image candidate
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ needs.metadata.outputs.image }}:candidate-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: |
            VERSION=${{ needs.metadata.outputs.version }}
            REVISION=${{ github.sha }}
            SOURCE=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  verify:
    needs: [metadata, build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: npm
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Tester exactement l’image publiée, par digest
        env:
          IMAGE: ${{ needs.metadata.outputs.image }}
          DIGEST: ${{ needs.build.outputs.digest }}
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_REVISION: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          docker pull --platform "$PLATFORM" "$IMAGE@$DIGEST"
          bash scripts/verify-image.sh "$IMAGE@$DIGEST" "$PLATFORM" npm test

  publish:
    needs: [metadata, build, verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ github.ref_name }}
      IMAGE: ${{ needs.metadata.outputs.image }}
      IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
      PRERELEASE: ${{ needs.metadata.outputs.prerelease }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Préparer les archives et leur traçabilité
        run: node scripts/release-assets.js "$RELEASE_TAG" "$RUNNER_TEMP/release"
      - name: Préparer la release en brouillon
        run: |
          printf 'Image Docker testée sur linux/amd64 et linux/arm64 :\n\n    %s@%s\n\nLes archives sources, SHA256SUMS et release.json sont joints.\n' "$IMAGE" "$IMAGE_DIGEST" > "$RUNNER_TEMP/release-notes.md"
          # Ce listing échoue explicitement si l’API est inaccessible.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | select(.draft == true) | .tag_name' > "$RUNNER_TEMP/drafts.txt"
          if ! grep -Fxq "$RELEASE_TAG" "$RUNNER_TEMP/drafts.txt"; then
            gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/release/"* --clobber
          gh release edit "$RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
      - name: Promouvoir le digest testé et publier la release
        run: |
          docker buildx imagetools create --tag "$IMAGE:$RELEASE_TAG" "$IMAGE@$IMAGE_DIGEST"
          if [ "$PRERELEASE" = true ]; then
            gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
          else
            docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$IMAGE_DIGEST"
            gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
          fi
